upstream djangopf {
    server django:8000;
}

upstream frontendpf {
    server frontend:3000;
}

server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    charset     utf-8;
    client_max_body_size 20M;
    
    set $basic ${BASIC};
    set $auth off;

    if ( $basic = "true") {
        set $auth "Restricted";
    }

    if ( $basic = "false" ) {
        set $auth off;
    }
    
    if ($http_user_agent = "ELB-HealthChecker/2.0") {
        set $auth off;
    }

    # ==============================
    # 💡 SSE ストリーム (Django)
    # ==============================
    location /api/scraper/stream {
        proxy_pass http://djangopf;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        keepalive_requests 1000;
        proxy_set_header Host $http_host;
        auth_basic $auth;
        auth_basic_user_file /etc/nginx/.htpasswd;
    }

    # ==============================
    # API (Django)
    # ==============================
    location /api/ {
        proxy_pass http://djangopf/api/;
        proxy_set_header Host $http_host;

        auth_basic $auth;
        auth_basic_user_file /etc/nginx/.htpasswd;
    }

    # ==============================
    # Django admin
    # ==============================
    location /admin/ {
        proxy_pass http://djangopf/admin/;
        proxy_set_header Host $http_host;

        auth_basic $auth;
        auth_basic_user_file /etc/nginx/.htpasswd;
    }

    # ==============================
    # フロントエンド (Next.js)
    # ==============================
    location / {
        proxy_pass http://frontendpf;
        proxy_set_header Host $http_host;

        auth_basic $auth;
        auth_basic_user_file /etc/nginx/.htpasswd;
    }

    location /static {
        alias /app/static/;
    }

    location /media {
        alias /app/media/;
    }
}

server_tokens off;
